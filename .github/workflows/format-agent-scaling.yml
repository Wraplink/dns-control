name: Format agent scaling PR
on:
  push:
    branches:
      - fix/agent-dns-stale-health-20261108
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format changed Go sources
        run: |
          gofmt -w cmd/dns-control/main.go internal/agentregistry/store.go internal/agentregistry/store_snapshot_test.go internal/backendregistry/agents.go internal/backendregistry/agents_test.go internal/dns/handler.go internal/dns/handler_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd/dns-control/main.go internal/agentregistry/store.go internal/agentregistry/store_snapshot_test.go internal/backendregistry/agents.go internal/backendregistry/agents_test.go internal/dns/handler.go internal/dns/handler_test.go
            git commit -m "style: gofmt agent scaling implementation"
            git push
          fi
