name: Format domain sync status
on:
  push:
    branches: [feature/domain-sync-status]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply gofmt
        run: |
          gofmt -w internal/api/domain_sync_status.go internal/api/handler.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/api/
            git commit -m "style: gofmt sync status endpoints"
            git push
          fi
