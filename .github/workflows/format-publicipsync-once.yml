name: Format public IP sync (feature branch)
on:
  push:
    branches:
      - feature/public-ip-sync-contract
    paths:
      - .github/workflows/format-publicipsync-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-ip-sync-contract
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format and commit
        run: |
          gofmt -w internal/publicipsync/*.go
          if ! git diff --quiet -- internal/publicipsync; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/publicipsync
            git commit -m "style: gofmt public IP sync contract"
            git push origin HEAD:feature/public-ip-sync-contract
          fi
      - name: Test
        run: go test ./internal/publicipsync/...