name: Format origin DNS feature
on:
  push:
    branches: [feature/configurable-agent-origin-resolution]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format changed Go files
        run: |
          gofmt -w internal/config/config.go internal/dns/resolver.go internal/dns/origin_agent_test.go internal/api/dns_resolve.go internal/api/origin_ipv4.go cmd/dns-control/main.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/ cmd/dns-control/main.go
            git commit -m "style: gofmt origin DNS feature"
            git push
          fi
