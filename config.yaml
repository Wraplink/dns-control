dns:
  listen: ${DNS_LISTEN}

  upstream: [${DNS_UPSTREAM}]
  ttl: 30

api:
  listen: ${API_LISTEN}

agent:
  token: "CHANGE-ME"
  lease_duration: 30s
  offline_after: 45s
  reconcile_interval: 5s

# Optional in development, required for paid-client DNS gating in production.
# The key must match backend NETWORK_CONTROL_SYNC_KEY.
backend:
  url: ${WRAPLINK_BACKEND_URL}
  control_key: ${NETWORK_CONTROL_SYNC_KEY}
  entitlement_refresh_interval: 10s
  entitlement_max_stale: 1m

# Advertise the DNS IPs that users can actually configure on their devices.
# When configured, this dns-control instance registers/heartbeats these addresses
# to backend, which selects two healthy addresses for the web connection page.
node:
  id: "dns-fra-01"
  region: "eu-central"
  public_dns:
    - 127.0.0.1
    - 192.168.108.134
  register_interval: 15s

domains:

  # SNI based hijack. Entitled source IPs receive the allocated edge address;
  # non-entitled clients resolve normally through the upstream resolvers.
  - domain: "playstation.com"
    mode: "hijack"

  # Route mode requires an explicit IPv4 destination, protocol and optional
  # destination-port range. Keep examples commented until a real relay/origin
  # destination has been selected for that domain.
  #
  # - domain: "game.example.com"
  #   mode: "route"
  #   route:
  #     destination_ip: "YOUR_RELAY_IPV4"
  #     protocol: "udp"
  #     destination_port_start: 30000
  #     destination_port_end: 31000

  # Normal DNS resolution.
  - domain: "google.com"
    mode: "normal"
